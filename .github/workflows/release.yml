name: Build Release

# 推送 v* 标签时自动构建便携版并发布到 Releases；
# 也可以在 Actions 页面手动触发，只产出 artifact 不发布。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建便携版
        run: npx electron-builder --win portable --x64

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: QuickTranslator-portable
          path: release/*.exe
          if-no-files-found: error

      - name: 发布到 Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
          generate_release_notes: true
